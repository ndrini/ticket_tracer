# Dove stanno le immagini. Cambiare "tipo" sposta l'intero progetto da un
# archivio all'altro: nessuna riga di codice da toccare.
#
# ATTENZIONE: le credenziali AWS NON vanno qui. Stanno in .env, che git ignora.
# Questo file e' versionato, quindi contiene solo scelte, non segreti.

[archivio]
# locale | s3 | drive
tipo = locale

# --- se tipo = locale ---
# radice relativa alla cartella del progetto
radice = data

# --- se tipo = s3 ---
# bucket = ticket-tracer-immagini
# prefisso = produzione/
# regione = eu-south-1

# --- se tipo = drive ---
# radice = ticket-tracer          # cartella di primo livello nel tuo Drive
#
# Nessuna credenziale qui nemmeno in questo caso: il consenso si da' una volta
# sola con `uv run python scripts/autorizza_drive.py` e finisce in
# ~/.config/ticket-tracer/token.json. L'ambito e' drive.file, cioe' solo i file
# creati da questo programma: il resto del Drive resta invisibile.
