# Dove stanno le immagini. Cambiare "tipo" sposta l'intero progetto da un
# archivio all'altro: nessuna riga di codice da toccare.
#
# ATTENZIONE: le credenziali AWS NON vanno qui. Stanno in .env, che git ignora.
# Questo file e' versionato, quindi contiene solo scelte, non segreti.

[archivio]
# locale | s3
tipo = locale

# --- se tipo = locale ---
# radice relativa alla cartella del progetto
radice = data

# --- se tipo = s3 ---
# bucket = ticket-tracer-immagini
# prefisso = produzione/
# regione = eu-south-1
