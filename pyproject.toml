[project]
name = "ticket-tracer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paddlepaddle",
    "paddleocr",
    "ollama",
    "pandas",
    "opencv-python-headless",
    "PyYAML",
    "scikit-learn",
    "pydantic"
]
authors = [
    { name = "ndrini", email = "aless@ndrini.eu" },
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "integration: richiede servizi esterni (Ollama, modelli locali) o immagini reali",
]
